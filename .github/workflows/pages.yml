name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run builddocs

      - name: Prepare Jekyll source
        run: |
          mkdir jekyll-src
          cp README.md _config.yml LICENSE jekyll-src/

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build project page
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./jekyll-src
          destination: ./_site

      - name: Add demo to site
        run: |
          sudo chown -R "$USER" _site
          mkdir -p _site/demo
          cp -R demo/. _site/demo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
